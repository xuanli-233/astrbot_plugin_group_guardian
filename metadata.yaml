name: astrbot_plugin_group_guardian # 这是你的插件的唯一识别名（保持不变，AstrBot 按它定位数据目录与配置）。
display_name: QQ群智能守护者（精简版） # 插件的显示名称
short_desc: 多群统一管理：关键词撤回备份、二维码 / 葵花码识别、跨群踢黑、批量公告、群名倒计时（需 OneBot / aiocqhttp，适配 LuckyLilliaBot）
desc: "基于 QQ群智能守护者 二次开发的多群管理精简版，已停用全部 AI 功能。关键词撤回并备份到指定群；二维码 / 葵花码两阶段识别（定位服务 + 解码服务）后按正则过滤；跨群踢人 / 踢出并拉黑、退群自动拉黑、黑名单入群即踢；重复群成员检测；批量群公告与待办公告；群名后缀、定时改名与倒计时；群成员本地缓存与接口限流；全部操作记录与拉黑原因；WebUI 管理面板。" # 插件简短描述
version: v2.9.0 # 插件版本号。格式：v1.1.1 或者 v1.1
author: zhaisir（原作者）、xuanli-233（二次开发） # 作者
astrbot_version: ">=4.24.2"
support_platforms:
  - aiocqhttp
